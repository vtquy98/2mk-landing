# Build and deploy to Cloudflare (Workers static assets, see wrangler.jsonc).
# Push to main = production. Pull request = preview URL (pr-<number>), posted as a PR comment.
name: Deploy
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run build
      - name: Deploy production
        if: github.event_name != 'pull_request'
        run: npx -y wrangler@4 deploy
      - name: Upload preview
        if: github.event_name == 'pull_request'
        run: |
          npx -y wrangler@4 versions upload --preview-alias "pr-${{ github.event.number }}" | tee out.txt
          url=$(grep -o 'https://pr-${{ github.event.number }}-[^ ]*workers\.dev' out.txt | head -1)
          echo "Preview: $url" >> "$GITHUB_STEP_SUMMARY"
          gh pr comment ${{ github.event.number }} --edit-last --create-if-none \
            --body "Preview: $url (commit ${{ github.event.pull_request.head.sha }})"
        env:
          GH_TOKEN: ${{ github.token }}
